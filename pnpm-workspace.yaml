# Native build scripts must be explicitly approved (pnpm 12 `allowBuilds`).
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261007.1"
  # Cloudhal's own releases are used the day they are published.
  - "@cloudhal/*"


# The version the monorepo builds and tests sites with (its lockfile); newer releases need a newer wrangler.
overrides:
  "@cloudflare/vite-plugin": 1.67.0
